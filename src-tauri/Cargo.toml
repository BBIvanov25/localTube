[package]
name = "localtube"
version = "1.2.1"
description = "A private, local video library"
authors = ["LocalTube contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"
